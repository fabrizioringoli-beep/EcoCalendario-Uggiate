name: Crea APK EcoCalendario

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android
        uses: android-actions/setup-android@v3

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: EcoCalendario-Uggiate
        run: gradle --no-daemon assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoCalendario-APK
          path: EcoCalendario-Uggiate/app/build/outputs/apk/debug/app-debug.apk
